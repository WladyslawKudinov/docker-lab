# ============================================================================
#  pg_secret.yml: логин и пароль PostgreSQL
# ============================================================================
#
#  ЧТО ТАКОЕ МАНИФЕСТ
#
#  Манифест это YAML-файл с описанием объекта, который должен
#  существовать в кластере Kubernetes. Kubernetes создаёт объект по
#  этому описанию и дальше поддерживает его в таком виде. Отступы в YAML
#  делаются пробелами и определяют вложенность, поэтому их нельзя
#  сбивать.
#
#  ЧТО ТАКОЕ SECRET И ЧЕМ ОН ОТЛИЧАЕТСЯ ОТ CONFIGMAP
#
#  Secret, как и ConfigMap, хранит пары "ключ: значение" и отдаёт их
#  контейнеру в виде переменных окружения. Разница в обращении:
#
#    - `kubectl describe secret postgres-secret` показывает только имена
#      ключей и размер значений в байтах, а сами значения скрыты.
#      У ConfigMap describe печатает всё открытым текстом;
#    - права на чтение Secret в кластере можно выдать отдельно от прав на
#      ConfigMap (через RBAC), то есть не все, кто видит настройки, видят
#      пароли;
#    - Kubernetes можно настроить шифровать Secret на диске.
#
#  Важно понимать: по умолчанию значения Secret хранятся в кодировке
#  base64, а это не шифрование. Любой, у кого есть право читать Secret,
#  получит пароль так:
#      kubectl get secret postgres-secret -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d
#  Secret защищает от случайного показа пароля, а не от человека с
#  полными правами на кластер.
#
#  Пароль в этом файле записан открытым текстом, потому что это учебный
#  проект. В реальных проектах файлы с паролями не кладут в git, а
#  создают Secret из хранилища паролей или командой
#      kubectl create secret generic postgres-secret --from-literal=...
#
#  ЗАЧЕМ ЭТОТ ФАЙЛ
#
#  Раньше POSTGRES_USER и POSTGRES_PASSWORD лежали в ConfigMap
#  postgres-configmap. Их перенесли сюда. Secret используют:
#    - pg_deployment.yml: Postgres создаёт пользователя с этим паролем;
#    - nextcloud.yml: Nextcloud подключается к базе с этим логином.
#
#  КОМАНДЫ
#
#    kubectl create -f pg_secret.yml
#    kubectl get secret
#    kubectl describe secret/postgres-secret     значения не показываются
# ============================================================================

apiVersion: v1
kind: Secret

metadata:
  name: postgres-secret
  labels:
    app: postgres

# Opaque: обычный секрет с произвольными ключами. Бывают и другие типы,
# например kubernetes.io/tls для сертификатов или
# kubernetes.io/dockerconfigjson для доступа к закрытому реестру образов.
type: Opaque

# stringData: значения пишутся обычным текстом, Kubernetes сам переведёт
# их в base64 при создании. Альтернатива, блок `data:`, требует сразу
# писать значения в base64 (например, `echo -n postgres | base64`).
stringData:
  # Имя пользователя базы данных. Официальный образ postgres создаёт его
  # при первом запуске и делает владельцем базы POSTGRES_DB.
  POSTGRES_USER: "postgres"
  # Пароль этого пользователя. Замени на свой.
  POSTGRES_PASSWORD: "Pg-Lab3-Change-Me"
