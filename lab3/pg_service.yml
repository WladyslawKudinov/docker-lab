# ============================================================================
#  pg_service.yml: постоянный сетевой адрес для PostgreSQL
# ============================================================================
#
#  ЧТО ТАКОЕ МАНИФЕСТ
#
#  Манифест это YAML-файл с описанием объекта, который должен
#  существовать в кластере Kubernetes. Kubernetes создаёт объект по
#  этому описанию. Отступы в YAML делаются пробелами и определяют
#  вложенность.
#
#  ЗАЧЕМ НУЖЕН SERVICE
#
#  Под (pod) это один или несколько контейнеров, запущенных вместе.
#  Каждый под получает свой IP-адрес, но этот адрес временный: если под
#  упадёт или его пересоздадут, у нового пода будет другой IP. Подключаться
#  к базе по IP пода нельзя, адрес в любой момент сменится.
#
#  Service решает эту проблему. У него есть:
#    - постоянное имя (postgres-service). Внутри кластера работает DNS,
#      и по этому имени Nextcloud находит базу: POSTGRES_HOST=postgres-service;
#    - постоянный внутренний IP (ClusterIP);
#    - selector, правило, по которому Service находит нужные поды.
#      Здесь это "все поды с меткой app: postgres". Запросы на Service
#      пересылаются в эти поды, какой бы IP у них сейчас ни был.
#
#    Nextcloud --> postgres-service:5432 --> под с меткой app=postgres
#
#  ТИПЫ SERVICE
#
#    ClusterIP  (по умолчанию) доступен только изнутри кластера.
#    NodePort   то же самое, плюс открывает порт (из диапазона 30000-32767)
#               на каждом узле кластера, чтобы достучаться снаружи.
#    LoadBalancer  просит у облачного провайдера внешний балансировщик.
#
#  Здесь NodePort, как в исходном примере: так к базе можно подключиться
#  с компьютера через minikube. Nextcloud'у хватило бы и ClusterIP.
#
#  КОМАНДЫ
#
#    kubectl create -f pg_service.yml
#    kubectl get service                         в столбце PORT(S) видно
#                                                 5432:3xxxx/TCP, где 3xxxx
#                                                 выданный NodePort
#    kubectl describe service/postgres-service   в Endpoints видно IP пода
#                                                 Postgres, если он запущен
# ============================================================================

apiVersion: v1
kind: Service

metadata:
  # Это имя становится DNS-именем внутри кластера. Именно его указывает
  # Nextcloud в POSTGRES_HOST.
  name: postgres-service
  labels:
    app: postgres

spec:
  type: NodePort

  ports:
    # port: порт, на котором слушает сам Service. 5432 стандартный порт
    # PostgreSQL. targetPort (порт контейнера) не указан, поэтому
    # Kubernetes берёт его равным port, то есть тоже 5432. nodePort тоже
    # не указан, его выберет кластер из диапазона 30000-32767.
    - port: 5432

  # selector: Service пересылает трафик во все поды с такими метками.
  # Метку app: postgres ставит на поды Deployment из pg_deployment.yml
  # (блок template.metadata.labels).
  selector:
    app: postgres
