# ============================================================================
#  pg_configmap.yml: обычные (не секретные) настройки PostgreSQL
# ============================================================================
#
#  ЧТО ТАКОЕ МАНИФЕСТ
#
#  Манифест это YAML-файл, в котором описано, какой объект должен
#  существовать в кластере Kubernetes. Мы не говорим кластеру "сделай
#  шаг 1, потом шаг 2", а описываем желаемый результат. Kubernetes сам
#  приводит кластер к этому описанию и дальше следит, чтобы так и было.
#
#  Правила YAML:
#    - вложенность задаётся отступами из пробелов (НЕ табуляцией).
#      Неверный отступ = другой смысл или ошибка при создании объекта;
#    - `ключ: значение`;
#    - строки, начинающиеся с `- `, это элементы списка;
#    - `#` начинает комментарий.
#
#  У любого манифеста есть четыре верхних блока:
#    apiVersion  версия API Kubernetes, в которой описан этот тип объекта
#    kind        тип объекта (ConfigMap, Secret, Service, Deployment...)
#    metadata    имя объекта и метки
#    data / spec содержимое объекта
#
#  ЧТО ТАКОЕ CONFIGMAP
#
#  ConfigMap это хранилище настроек в виде пар "ключ: значение". Под
#  (запущенный контейнер) может получить эти пары как переменные
#  окружения. Так настройки отделены от образа: чтобы поменять имя базы,
#  не нужно пересобирать образ, достаточно изменить ConfigMap.
#
#  ConfigMap хранит данные открытым текстом, любой с доступом к кластеру
#  увидит их командой `kubectl describe configmap postgres-configmap`.
#  Поэтому логин и пароль отсюда убраны в отдельный объект Secret
#  (файл pg_secret.yml). Здесь осталось только имя базы данных.
#
#  КОМАНДЫ
#
#    kubectl create -f pg_configmap.yml          создать объект
#    kubectl get configmap                       список ConfigMap
#    kubectl describe configmap/postgres-configmap   подробности
# ============================================================================

# v1: базовая группа API, в ней лежат ConfigMap, Secret, Service, Pod.
apiVersion: v1
kind: ConfigMap

metadata:
  # Имя объекта. По нему на ConfigMap ссылаются другие манифесты:
  # pg_deployment.yml (Postgres) и nextcloud.yml (Nextcloud).
  name: postgres-configmap
  # Метки (labels) это произвольные пары "ключ: значение" для поиска и
  # группировки объектов. Например, `kubectl get all -l app=postgres`
  # покажет всё, что относится к Postgres.
  labels:
    app: postgres

# data: сами настройки. Значения всегда строки, поэтому в кавычках.
data:
  # Имя базы, которую официальный образ postgres создаст при первом
  # запуске. Ту же переменную читает Nextcloud, чтобы знать, к какой базе
  # подключаться.
  POSTGRES_DB: "postgres"

  # POSTGRES_USER и POSTGRES_PASSWORD раньше были здесь. Теперь они в
  # Secret postgres-secret (pg_secret.yml).
