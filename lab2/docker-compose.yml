# ============================================================================
#  docker-compose.yml: описание всей системы из нескольких контейнеров
# ============================================================================
#
#  ЗАЧЕМ НУЖЕН COMPOSE
#
#  Одиночный контейнер запускают командой `docker run` с кучей флагов:
#  -p, -v, -e, --name, --network... Когда контейнеров три, запускать их
#  вручную долго, легко ошибиться и важно не перепутать порядок. Compose
#  позволяет описать все контейнеры, их настройки и связи в одном файле,
#  а потом поднять всё одной командой.
#
#  Формат файла YAML. Правила:
#    - вложенность задаётся отступами (пробелами, НЕ табуляцией). Отступ
#      показывает, к чему относится строка;
#    - `ключ: значение`;
#    - строки, которые начинаются с `- `, это элементы списка;
#    - `#` начинает комментарий.
#
#  ИЗ ЧЕГО СОСТОИТ СИСТЕМА
#
#    init   одноразовый. Запускается первым, создаёт файл счётчика с
#           начальным значением и завершается.
#    app    веб-сервис со счётчиком посещений (Flask + gunicorn). Образ
#           собирается из Dockerfile в этой папке.
#    proxy  nginx. Принимает запросы с твоего компьютера на порт 8080 и
#           пересылает их в app.
#
#  Порядок запуска (его обеспечивает depends_on):
#
#    init  --(завершился успешно)-->  app  --(стал healthy)-->  proxy
#
#  Все три контейнера подключены к одной сети lab2-net. init и app
#  подключают один и тот же том lab2-data в папку /data.
#
#  КОМАНДЫ (выполнять в папке, где лежит этот файл)
#
#    docker compose up -d --build   собрать образ и запустить всё в фоне
#                                   (-d: не занимать терминал, --build:
#                                   пересобрать образ, если код менялся)
#    docker compose ps -a           состояние контейнеров (-a: показать и
#                                   завершившийся init)
#    curl localhost:8080/           Visits: 101, 102, ...
#    docker compose logs -f         логи всех сервисов (Ctrl+C для выхода)
#    docker compose down            остановить и удалить контейнеры и сеть.
#                                   Том с данными остаётся.
#    docker compose down -v         то же, плюс удалить том (счётчик
#                                   начнётся с начала)
#
#  ПОЧЕМУ НЕТ СТРОКИ version: "3.8"
#
#  Раньше файл начинался с номера версии формата. Современный Docker
#  Compose (команда `docker compose`, через пробел) этот ключ не
#  использует и выводит предупреждение "version is obsolete", если его
#  указать. Поэтому строка не нужна.
#
#  ОТКУДА БЕРУТСЯ ${...}
#
#  Записи вида ${APP_IMAGE} compose заменяет значениями из файла .env,
#  который лежит рядом. Все настройки собраны там, здесь только
#  ссылки на них. Посмотреть файл с уже подставленными значениями:
#      docker compose config
# ============================================================================


# services: список контейнеров. Каждый ключ внутри (init, app, proxy) это
# имя сервиса. По этому имени к сервису обращаются в командах compose,
# например `docker compose logs app`.
services:

  # --------------------------------------------------------------------------
  # init: одноразовый подготовительный сервис.
  #
  # Задача: перед стартом приложения положить в том файл счётчика с
  # начальным значением COUNTER_START из .env. Если файл уже есть (это не
  # первый запуск), ничего не трогать, иначе счётчик сбрасывался бы при
  # каждом перезапуске.
  #
  # Такие сервисы в реальных проектах создают таблицы в базе данных,
  # загружают начальные данные, скачивают файлы. Они делают работу один
  # раз и завершаются, а основные сервисы ждут их окончания.
  # --------------------------------------------------------------------------
  init:
    # build: собрать образ из Dockerfile в указанной папке. Точка значит
    # "папка, где лежит этот docker-compose.yml". Отдельной команды
    # `docker build` не нужно: compose соберёт образ сам при
    # `docker compose up --build`, а если образа ещё нет, то и без --build.
    build: .
    # image рядом с build значит: собранный образ назвать этим именем
    # (lab2-app:1.0 из .env). Без этой строки compose придумал бы имя сам,
    # вроде lab2-init. У init и app указаны одинаковые build и image, то
    # есть оба сервиса запускаются из одного образа: в нём уже есть
    # Python, нужный пользователь и папка /data.
    image: ${APP_IMAGE}
    # container_name: точное имя контейнера. Без него compose назвал бы
    # контейнер по шаблону <проект>-<сервис>-<номер>, например
    # lab2-init-1. С фиксированным именем к контейнеру удобно обращаться:
    # `docker logs lab2-init`.
    container_name: lab2-init
    # env_file: взять переменные из файла .env и передать их внутрь
    # контейнера. Скрипту ниже нужны DATA_DIR и COUNTER_START.
    env_file: .env
    # entrypoint и command вместе определяют, что запустится в контейнере.
    # Они заменяют ENTRYPOINT и CMD из Dockerfile. Docker склеивает их:
    # сначала entrypoint, потом command. Здесь получится
    #     /bin/sh -c "<скрипт из command>"
    # то есть "запусти командную оболочку sh и выполни в ней этот текст".
    # Вместо сервера gunicorn из Dockerfile выполнится короткий скрипт.
    entrypoint: ["/bin/sh", "-c"]
    # `>` в YAML значит "дальше многострочный текст, склеить строки через
    # пробел". Так длинную команду можно записать читаемо.
    #
    # Почему $$ вместо $: compose сам подставляет переменные вида $ИМЯ
    # в этом файле. $$ означает "оставь здесь знак $ как есть". Тогда
    # переменную подставит уже оболочка sh внутри контейнера, из
    # окружения контейнера (оно пришло из env_file).
    #
    # Что делает скрипт:
    #   if [ -f файл ]          если файл счётчика уже существует,
    #   then echo ...           просто сообщить его значение;
    #   else echo N > файл      иначе записать в него начальное число.
    #   `$$(cat файл)` подставляет содержимое файла в текст сообщения.
    command: >
      'if [ -f "$$DATA_DIR/counter.txt" ];
      then echo "init: counter already exists, value $$(cat $$DATA_DIR/counter.txt)";
      else echo "$$COUNTER_START" > "$$DATA_DIR/counter.txt" && echo "init: counter created, value $$COUNTER_START";
      fi'
    # volumes: подключить том lab2-data (объявлен в самом конце файла) в
    # папку /data внутри контейнера. Сюда init пишет файл, отсюда app его
    # потом читает: том общий.
    volumes:
      - counter-data:/data
    # restart: "no": если контейнер завершился, не запускать его заново.
    # Для одноразового сервиса это и нужно. Кавычки обязательны: без них
    # YAML прочитал бы no как логическое "ложь", а не как слово.
    restart: "no"
    networks:
      - lab2-net

  # --------------------------------------------------------------------------
  # app: само приложение, счётчик посещений.
  # --------------------------------------------------------------------------
  app:
    # Тот же образ, что у init (см. пояснения к build и image выше).
    build: .
    image: ${APP_IMAGE}
    container_name: lab2-app
    env_file: .env
    # command заменяет CMD из Dockerfile. Здесь та же команда запуска
    # gunicorn, что и в Dockerfile, только порт берётся из .env. Так
    # порт задан в одном месте, и nginx с проверкой здоровья используют
    # то же значение.
    #   --bind 0.0.0.0:5000   слушать порт на всех сетевых адресах
    #                         контейнера, иначе nginx из соседнего
    #                         контейнера не достучится
    #   --workers 1           один рабочий процесс: счётчик лежит в файле,
    #                         два процесса могли бы писать одновременно
    #   --access-logfile -    печатать каждый запрос в логи контейнера
    #   app:app               файл app.py, объект app
    command: ["gunicorn", "--bind", "0.0.0.0:${APP_PORT}", "--workers", "1", "--access-logfile", "-", "app:app"]
    # Том тот же, что у init: приложение видит файл, который тот создал.
    volumes:
      - counter-data:/data
    # depends_on: от каких сервисов зависит этот и чего от них ждать.
    #
    # Короткая запись `depends_on: [init]` значит только "запусти init
    # раньше". Она не ждёт, пока init закончит работу. Поэтому здесь
    # указано условие:
    #   service_completed_successfully   ждать, пока init ЗАВЕРШИТСЯ с
    #                                    кодом 0 (без ошибки). Если init
    #                                    упадёт, app не запустится вовсе.
    depends_on:
      init:
        condition: service_completed_successfully
    # healthcheck: как Docker проверяет, что приложение работает.
    #
    # В Dockerfile уже есть HEALTHCHECK, этот блок его заменяет: здесь
    # проверка чаще, чтобы proxy, который ждёт статуса healthy, стартовал
    # через секунды, а не через полминуты.
    #   test          команда проверки. Код выхода 0 значит "здоров",
    #                 любой другой значит "болен". Python-однострочник
    #                 запрашивает адрес /health; если сервер не ответил,
    #                 urlopen выбрасывает ошибку и python выходит с кодом 1.
    #                 Пишем на python, потому что curl в образе нет.
    #                 "CMD" в начале значит "выполнить без оболочки".
    #   interval      как часто проверять
    #   timeout       сколько ждать ответа, прежде чем считать проверку
    #                 проваленной
    #   retries       сколько провалов подряд нужно, чтобы контейнер
    #                 получил статус unhealthy
    #   start_period  время на запуск: провалы в первые секунды после
    #                 старта не засчитываются
    # Статус видно в `docker compose ps`: (healthy) или (unhealthy).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:${APP_PORT}/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    # deploy.resources.limits: ограничение ресурсов. Контейнеру можно
    # использовать не больше половины одного ядра процессора и 256 МБ
    # памяти. Если процесс попробует занять больше памяти, ядро системы
    # его завершит, и контейнер перезапустится (см. restart). Без
    # ограничения сломавшееся приложение могло бы съесть всю память
    # компьютера и замедлить остальные программы.
    # Проверка:  docker stats lab2-app   (колонка MEM USAGE / LIMIT)
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    # restart: unless-stopped: если приложение упало, Docker перезапустит
    # контейнер сам. Не перезапустит, только если ты остановил его
    # вручную (docker compose stop).
    restart: unless-stopped
    # У app нет раздела ports: снаружи к нему не подключиться, только
    # из сети lab2-net. Все запросы идут через proxy.
    networks:
      - lab2-net

  # --------------------------------------------------------------------------
  # proxy: nginx перед приложением.
  # --------------------------------------------------------------------------
  proxy:
    # Готовый образ с Docker Hub, собирать ничего не нужно. Версия в .env.
    image: ${NGINX_IMAGE}
    container_name: lab2-proxy
    # Отсюда nginx получает APP_HOST и APP_PORT и подставляет их в свой
    # файл настроек (подробно описано в nginx/default.conf.template).
    env_file: .env
    # ports: пробросить порт наружу, на твой компьютер.
    # Запись "8080:80" значит "порт 8080 компьютера соединить с портом 80
    # контейнера". Слева порт хоста (из .env), справа порт внутри
    # контейнера. Теперь http://localhost:8080/ открывает nginx.
    # Кавычки рекомендуются: некоторые записи вида ЧИСЛО:ЧИСЛО YAML
    # может прочитать как число в шестидесятеричной системе.
    ports:
      - "${PROXY_PORT}:80"
    # Здесь другой вид volume: bind mount, "подключение папки с
    # компьютера". Слева путь на твоём компьютере (относительно этого
    # файла), справа путь в контейнере. В отличие от именованного тома
    # (counter-data), который хранит Docker, здесь контейнер видит твой
    # настоящий файл: поправил его, перезапустил proxy, изменения
    # применились, пересобирать ничего не нужно.
    #   :ro  read-only, только чтение. Контейнеру незачем менять файл.
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    # Ждать, пока app не станет healthy, то есть пока его healthcheck
    # не пройдёт. Просто "запущен" мало: gunicorn стартует пару секунд, и
    # первые запросы nginx получили бы ошибку 502 (Bad Gateway, "тот, кому
    # я пересылаю запрос, не отвечает").
    depends_on:
      app:
        condition: service_healthy
    # Проверка здоровья самого nginx. Запрос идёт через nginx в
    # приложение, так что healthy здесь значит "вся цепочка работает".
    # wget это маленькая программа для HTTP-запросов, в alpine-образе она
    # есть. -q: ничего не печатать, -O /dev/null: ответ выбросить.
    # 127.0.0.1, а не localhost: в alpine localhost может означать адрес
    # IPv6, а nginx здесь слушает только IPv4.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - lab2-net


# networks: сети, к которым подключаются контейнеры.
#
# Контейнеры в одной сети видят друг друга по имени: nginx обращается к
# приложению по адресу lab2-app:5000. Контейнеры из других сетей сюда не
# достучатся.
#
# Если сеть не указать, compose всё равно создаст сеть по умолчанию с
# именем <проект>_default. Здесь сеть объявлена явно, чтобы было видно, как
# связаны сервисы, и чтобы у неё было понятное имя.
#   name: lab2-net   точное имя сети в Docker (иначе было бы lab2_lab2-net)
#   driver: bridge   обычная локальная сеть на одном компьютере, вид по
#                    умолчанию
# Проверка:  docker network inspect lab2-net   (в Containers будут все три)
networks:
  lab2-net:
    name: lab2-net
    driver: bridge


# volumes: именованные тома, которые хранит Docker. Данные в них живут,
# пока том не удалят явно (`docker compose down -v` или
# `docker volume rm lab2-data`). Удаление контейнеров их не трогает.
#   name: lab2-data   точное имя тома (иначе было бы lab2_counter-data)
# Проверка:  docker volume ls
volumes:
  counter-data:
    name: lab2-data
