# ============================================================================
#  10-configmap.yaml: обычные (не секретные) настройки приложения.
#
#  Манифест это описание объекта для Kubernetes. Поля apiVersion (версия
#  API), kind (тип объекта), metadata (имя, namespace, метки) есть у
#  каждого манифеста. Применяется командой:
#      kubectl apply -f k8s/10-configmap.yaml
#
#  ЧТО ТАКОЕ CONFIGMAP
#
#  ConfigMap хранит настройки в виде пар "ключ: значение" отдельно от
#  образа. Под подключает ConfigMap и получает эти значения как переменные
#  окружения или как файлы. Смысл тот же, что у файла .env в docker
#  compose: один и тот же образ lab4-app:1.0 можно запустить с другими
#  настройками, поменяв только ConfigMap, без пересборки.
#
#  Кто пользуется этим ConfigMap (k8s/40-app-deployment.yaml):
#    - init-контейнер: берёт DATA_DIR и COUNTER_START, чтобы создать файл
#      счётчика с начальным значением;
#    - контейнер приложения: берёт DATA_DIR (где файл) и COUNTER_START
#      (на какое число сбрасывать по POST /reset).
#  Подключение там сделано через envFrom: все ключи отсюда становятся
#  переменными окружения с теми же именами.
#
#  Важно: переменные окружения читаются только при старте контейнера. Если
#  изменить ConfigMap, работающие поды старые значения не забудут. Чтобы
#  они подхватили новые, поды перезапускают:
#      kubectl rollout restart deployment/lab4-app -n lab4
#
#  Посмотреть содержимое:
#      kubectl get configmap lab4-app-config -n lab4 -o yaml
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab4-app-config
  # namespace: в каком пространстве имён создать объект (создано в
  # k8s/00-namespace.yaml).
  namespace: lab4
  # Метки для поиска и группировки, Kubernetes по ним сам ничего не делает:
  #   name     к какому приложению относится объект
  #   part-of  к какой системе в целом (все объекты этой работы)
  # Найти все объекты приложения:  kubectl get all,cm -n lab4 -l app.kubernetes.io/name=lab4-app
  labels:
    app.kubernetes.io/name: lab4-app
    app.kubernetes.io/part-of: lab4-counter
# data: сами настройки. Значения всегда строки, поэтому числа в кавычках:
# без кавычек YAML прочитал бы 100 как число, и Kubernetes отказался бы
# принимать манифест.
data:
  # Папка, в которую подключён том с файлом счётчика.
  DATA_DIR: "/data"
  # С какого числа начинать счёт.
  COUNTER_START: "100"
