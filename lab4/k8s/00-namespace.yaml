# ============================================================================
#  00-namespace.yaml: отдельное пространство имён lab4 для всех объектов
#  этой работы.
#
#  КАК УСТРОЕН ЛЮБОЙ МАНИФЕСТ KUBERNETES
#
#  Манифест это YAML-файл с описанием объекта: "хочу, чтобы в кластере
#  был вот такой объект". Команда `kubectl apply -f файл` отправляет его в
#  кластер, а Kubernetes сам создаёт объект или приводит существующий к
#  описанию. Повторный apply без изменений ничего не меняет.
#
#  У каждого манифеста четыре верхних поля:
#    apiVersion  версия API Kubernetes, в которой описан этот тип объекта
#    kind        тип объекта: Namespace, Deployment, Service, ...
#    metadata    имя объекта, пространство имён, метки
#    spec        что именно нужно (у Namespace spec не нужен)
#
#  YAML: вложенность задаётся отступами из пробелов (не табуляции),
#  `ключ: значение`, строки с `- ` это элементы списка, `#` комментарий.
#
#  ЗАЧЕМ ПРОСТРАНСТВО ИМЁН
#
#  Namespace это "папка" внутри кластера. Объекты из разных namespace не
#  мешают друг другу, даже если называются одинаково. Все объекты этой
#  работы лежат в lab4, поэтому:
#    - их легко посмотреть отдельно:   kubectl get all -n lab4
#    - их легко удалить разом:          kubectl delete namespace lab4
#    - они не смешиваются с объектами ЛР 3 в namespace default.
#
#  ПОЧЕМУ ФАЙЛЫ ПРОНУМЕРОВАНЫ
#
#  `kubectl apply -f k8s/` применяет файлы папки по алфавиту. Namespace
#  должен появиться раньше всего, что в нём лежит, иначе kubectl ответит
#  "namespaces lab4 not found". Номер 00 ставит этот файл первым.
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: lab4
  # labels: метки, пары "ключ: значение", которые можно повесить на любой
  # объект. Kubernetes по ним ничего не делает сам, они нужны людям и
  # инструментам для поиска и группировки. Например:
  #     kubectl get namespaces -l app.kubernetes.io/part-of=lab4-counter
  # Ключи вида app.kubernetes.io/... это рекомендованные Kubernetes
  # стандартные метки, их понимают многие инструменты.
  labels:
    app.kubernetes.io/part-of: lab4-counter
