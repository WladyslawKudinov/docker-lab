# ============================================================================
#  20-secret.yaml: секретная настройка приложения, токен для сброса счётчика.
#
#  Манифест это описание объекта для Kubernetes. Поля apiVersion (версия
#  API), kind (тип объекта), metadata (имя, namespace, метки) есть у
#  каждого манифеста. Применяется командой:
#      kubectl apply -f k8s/20-secret.yaml
#
#  ЧТО ТАКОЕ SECRET И ЧЕМ ОН ОТЛИЧАЕТСЯ ОТ CONFIGMAP
#
#  Устроен так же, как ConfigMap: пары "ключ: значение", которые под
#  получает как переменные окружения или файлы. Отличия:
#    - доступ к Secret в кластере можно запретить отдельно от остального.
#      Например, разработчику разрешают смотреть ConfigMap, но не Secret;
#    - kubectl не показывает значения в обычном выводе:
#      `kubectl describe secret` выводит только размер значения в байтах;
#    - в кластере значения хранятся в base64, а Kubernetes можно настроить
#      так, чтобы он их ещё и шифровал на диске.
#
#  base64 это НЕ шифрование, а просто способ записать любые байты
#  буквами. Раскодировать его может кто угодно:
#      kubectl get secret lab4-app-secret -n lab4 -o jsonpath='{.data.RESET_TOKEN}' | base64 -d
#  Защита Secret держится на правах доступа в кластере, а не на base64.
#
#  ВАЖНО ПРО ЭТОТ ФАЙЛ
#
#  Здесь токен лежит открытым текстом, потому что это учебная работа и
#  значение ничего не защищает. В настоящем проекте файл с секретом в git
#  не кладут: любой, кто видит репозиторий, увидит и пароль. Secret тогда
#  создают командой прямо в кластере:
#      kubectl create secret generic lab4-app-secret -n lab4 \
#          --from-literal=RESET_TOKEN=<настоящий токен>
#  или хранят в git только в зашифрованном виде (инструменты Sealed
#  Secrets, SOPS).
#
#  Кто пользуется: контейнер приложения в k8s/40-app-deployment.yaml
#  получает ключ RESET_TOKEN как переменную окружения. Проверка:
#      curl -X POST -H "X-Reset-Token: lab4-demo-token" <адрес>/reset
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: lab4-app-secret
  namespace: lab4
  # Метки для поиска и группировки, Kubernetes по ним сам ничего не делает.
  labels:
    app.kubernetes.io/name: lab4-app
    app.kubernetes.io/part-of: lab4-counter
# type: Opaque значит "произвольные данные". Есть и другие типы, например
# для TLS-сертификатов или паролей к реестру образов.
type: Opaque
# stringData: значения обычным текстом, Kubernetes сам закодирует их в
# base64 при сохранении. Альтернатива, поле data, требует писать уже
# закодированные значения, это неудобно и легко ошибиться.
stringData:
  RESET_TOKEN: "lab4-demo-token"
