# ============================================================================
#  30-pvc.yaml: запрос на постоянный диск для файла счётчика.
#
#  Манифест это описание объекта для Kubernetes. Поля apiVersion (версия
#  API), kind (тип объекта), metadata (имя, namespace, метки) есть у
#  каждого манифеста, spec описывает, что именно нужно. Применяется:
#      kubectl apply -f k8s/30-pvc.yaml
#
#  ЗАЧЕМ ПОСТОЯННЫЙ ТОМ
#
#  Всё, что контейнер записал внутрь себя, пропадает вместе с подом. А поды
#  в Kubernetes пересоздаются постоянно: при обновлении, при падении, при
#  переносе на другую машину. Чтобы счётчик пережил это, файл должен лежать
#  на томе, который существует отдельно от пода.
#
#  КАК ЭТО УСТРОЕНО
#
#    PersistentVolumeClaim (PVC, этот файл)  "заявка": мне нужен диск на
#                                            100 МБ с таким-то доступом.
#    PersistentVolume (PV)                   сам диск. Его не надо
#                                            описывать вручную: в Minikube
#                                            есть StorageClass "standard",
#                                            который по заявке сам создаёт
#                                            PV (папку на узле Minikube).
#    Под                                     подключает PVC по имени
#                                            (k8s/40-app-deployment.yaml,
#                                            раздел volumes).
#
#  Разделение нужно, чтобы манифест приложения не зависел от того, где
#  кластер берёт диски. В Minikube это папка, в облаке сетевой диск, а PVC
#  и Deployment одинаковые.
#
#  PVC не удаляется, когда удаляют под или Deployment. Данные пропадут,
#  только если удалить сам PVC или весь namespace lab4.
#
#  Проверка:
#      kubectl get pvc -n lab4      STATUS должен быть Bound (заявка
#                                   выполнена, диск выделен)
#      kubectl get pv               созданный под заявку диск
# ============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lab4-data
  namespace: lab4
  # Метки для поиска и группировки, Kubernetes по ним сам ничего не делает.
  labels:
    app.kubernetes.io/name: lab4-app
    app.kubernetes.io/part-of: lab4-counter
spec:
  # accessModes: как том можно подключать.
  #   ReadWriteOnce  на чтение и запись, но только с одного узла кластера.
  #                  Самый распространённый вариант, его поддерживают все
  #                  хранилища. Нам больше и не нужно: под приложения один.
  #   ReadWriteMany  с нескольких узлов одновременно, нужно сетевое
  #                  хранилище.
  accessModes:
    - ReadWriteOnce
  # Размер диска. Mi это мебибайты. Файлу с одним числом хватит с запасом.
  resources:
    requests:
      storage: 100Mi
  # storageClassName не указан: Kubernetes возьмёт класс по умолчанию.
  # В Minikube это "standard" (посмотреть: kubectl get storageclass).
